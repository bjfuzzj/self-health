name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r cloud/requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.cjs
      - run: node --test tests/test_h5_frontend.cjs tests/test_h5_intake.cjs
      - run: node --check h5/intake.js
      - run: node --check h5/voice.js
      - run: node --check h5/app.js
      - run: node --check assets/app.js
      - run: node --check assets/charts.js
      - run: python tools/package_release.py
